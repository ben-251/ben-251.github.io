{{ define "main" }}
	<main>
		{{ partial "post-header.html" . }}

		<article>
			<!-- "{{.Content}}" pulls from the markdown content of the corresponding _index.md -->
			{{.Content}}
		</article>

		{{ $section := .Section }}
		{{ $pages := .Site.GetPage "section" $section }}

		{{ if not $pages.Pages }}
			{{ partial "empty" . }}
		{{ else }}
		{{ end }}


		{{ partial "poem-list.html" (dict
  			"pages" .Pages
  			"home" false
		) }}
	</main>
{{ end }}
